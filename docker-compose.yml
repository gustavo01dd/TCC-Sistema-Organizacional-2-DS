# ============================================================
# Pesquisa de Clima Organizacional - ambiente Docker
#   Subir:     docker compose up -d --build
#   Preparar:  docker compose exec php php /var/www/database/seed.php
#   Acessar:   http://localhost:8080
#   E-mails:   http://localhost:8025  (caixa de entrada de teste do Mailpit)
#   Demonstração (só na apresentação): docker compose exec php php /var/www/database/demo.php
# ============================================================

# Variáveis do PHP, usadas pelo site (php) e pelo agendador
x-ambiente-php: &ambiente-php
  DB_HOST: mariadb
  DB_NAME: clima_tcc
  DB_USER: clima_user
  DB_PASS: clima_pass
  DB_TIMEZONE: "-03:00"
  TZ: America/Sao_Paulo
  # RF08: e-mails de abertura, encerramento e lembrete.
  # Sem arquivo .env, tudo vai para o Mailpit (teste). Para usar um e-mail de verdade
  # (Gmail, por exemplo), copie .env.exemplo para .env e preencha: nada aqui precisa mudar.
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_SEGURANCA: ${SMTP_SEGURANCA:-}
  SMTP_USUARIO: ${SMTP_USUARIO:-}
  SMTP_SENHA: ${SMTP_SENHA:-}
  # remetente institucional de todos os avisos (RH)
  SMTP_REMETENTE: ${SMTP_REMETENTE:-rh@empresa.local}
  SMTP_NOME: "${SMTP_NOME:-Climatize RH}"
  # "Responder para" dos lembretes. Vazio = email do gestor que clicou em Lembrete
  EMAIL_GESTOR_LEMBRETES: ${EMAIL_GESTOR_LEMBRETES:-}
  APP_URL: ${APP_URL:-http://localhost:8080}

services:
  mariadb:
    image: mariadb:10.11
    container_name: clima_mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: clima_tcc
      MYSQL_USER: clima_user
      MYSQL_PASSWORD: clima_pass
      TZ: America/Sao_Paulo
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
    ports:
      - "3306:3306"

  php:
    build: ./docker/php
    container_name: clima_php
    restart: unless-stopped
    depends_on:
      - mariadb
      - mailpit
    environment: *ambiente-php
    volumes:
      - ./public:/var/www/public
      - ./database:/var/www/database

  # Tarefas no horário certo, mesmo sem ninguém usando o site: a cada 5 minutos
  # encerra as pesquisas vencidas (com o relatório) e manda os avisos por e-mail,
  # inclusive o lembrete automático dos últimos dias.
  agendador:
    build: ./docker/php
    container_name: clima_agendador
    restart: unless-stopped
    depends_on:
      - mariadb
      - mailpit
    environment: *ambiente-php
    volumes:
      - ./public:/var/www/public
      - ./database:/var/www/database
    command: ["sh", "-c", "while true; do php /var/www/database/tarefas.php; sleep 300; done"]

  nginx:
    image: nginx:alpine
    container_name: clima_nginx
    restart: unless-stopped
    depends_on:
      - php
    ports:
      - "8080:80"
    volumes:
      - ./public:/var/www/public
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

  # RF08: servidor de e-mail de teste. Nenhum e-mail sai de verdade: todos ficam
  # na caixa de entrada de http://localhost:8025, ótimo para demonstrar.
  mailpit:
    image: axllent/mailpit
    container_name: clima_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"

  # RNF10: backup diário automático do banco na pasta ./backups (guarda 7 dias)
  backup:
    image: mariadb:10.11
    container_name: clima_backup
    restart: unless-stopped
    depends_on:
      - mariadb
    environment:
      MYSQL_PWD: clima_pass
      TZ: America/Sao_Paulo
    volumes:
      - ./backups:/backups
    entrypoint:
      - sh
      - -c
      - |
        until mariadb-admin ping -h mariadb -u clima_user --silent; do sleep 5; done
        while true; do
          mariadb-dump -h mariadb -u clima_user --single-transaction clima_tcc > /backups/clima_tcc_$$(date +%Y-%m-%d).sql
          find /backups -name 'clima_tcc_*.sql' -mtime +7 -delete
          sleep 86400
        done

volumes:
  mariadb_data: